<!DOCTYPE html>
<html>
<head>
    <title>NetPulse Dashboard</title>
     <link rel="stylesheet" href="dashboardStyle.css">
</head>

<body>

    <div class="dashboard">

        <div class="sidebar">

            <div class="logo">
                NetPulse
            </div>

            <div class="menu">
                <a href="#">Dashboard</a>
                <a href="#">Devices</a>
                <a href="#">Analytics</a>
                <a href="#">Alerts</a>
                <a href="#">Settings</a>
            </div>

        </div>

        <div class="mainContent">

            <div class="topbar">
                <h1>Network Dashboard</h1>

                <p>Admin</p>
            </div>

            <div class="cards">

                <div class="card">
                    <h2>24</h2>
                    <p>Connected Devices</p>
                </div>

                <div class="card">
                    <h2>99%</h2>
                    <p>Network Uptime</p>
                </div>

                <div class="card">
                    <h2>3</h2>
                    <p>Security Alerts</p>
                </div>

                <div class="card">
                    <h2>120 Mbps</h2>
                    <p>Traffic Speed</p>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
